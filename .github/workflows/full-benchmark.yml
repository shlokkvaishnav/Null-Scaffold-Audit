name: Full Feynman Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

jobs:
  full-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,gbm]"
      - run: python -m equation_discovery.evaluation.benchmark_runner --subset all --backend gplearn
      - uses: actions/upload-artifact@v4
        with:
          name: feynman-benchmark-results
          path: results/feynman_benchmark/
