# Milestone 0 gates (BOOTSTRAP.md section 18, item 6).
#
# Every job here exists to move a rule from convention into enforcement. A rule
# that depends on reviewer attention is a rule that erodes, so nothing in this
# file is advisory: there are no `continue-on-error` escapes, and no job reports
# success on a check it did not actually run.
#
# The environment is resolved from the committed uv.lock rather than from a
# fresh dependency resolution, so a CI run a year from now installs the same
# packages as one today (BOOTSTRAP.md section 11.1).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  # A lock file that has drifted from pyproject.toml is not a lock file. This
  # runs first and cheaply, because every other job's environment depends on it
  # being trustworthy.
  lockfile:
    name: Lock file is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra gbm
      - run: uv run mypy engine tools

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra gbm
      # The coverage floor is scoped to tools/ because that is the code
      # Milestone 0 introduces. It widens as each subsystem is rebuilt against
      # its RFC; a floor averaged over a tree that is being replaced measures
      # nothing (BOOTSTRAP.md section 11).
      - name: Test suite with coverage floor
        run: uv run pytest tests/ -v --cov=tools --cov-report=term-missing --cov-fail-under=95

  # Constitution Article 5. This is the project's central architectural claim,
  # and the only reason it is a claim rather than a hope is that this job fails
  # the build when it stops being true.
  domain-independence:
    name: Engine is domain independent (Article 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check engine/ for scientific content
        run: python tools/check_domain_independence.py --path engine

  # Legacy tree, pending migration behind the plugin contract. Retained so its
  # failures stay visible rather than being deleted out of view.
  legacy-smoke-benchmark:
    name: Legacy smoke benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra gbm
      - run: uv run python -m physics_discovery.evaluation.benchmark_runner --subset smoke --backend gplearn
