name: Research question
description: >-
  A spec for a research/experiment/analysis/method/reproduction branch, per
  research/SPEC_TEMPLATE.md. This issue body IS the spec -- the implementer
  copies it into SPEC.md as the branch's first commit, per research/GIT_WORKFLOW.md.
title: "[research]: "
labels: ["stage:proposed"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `README.md`'s "Open research questions" list and
        `research/DECISION_LOG.md` so this doesn't re-propose something already
        answered or explicitly ruled out. Read `research/AUDIT_METHODOLOGY.md`
        if this touches the audit's statistical design.

        Fill this in BEFORE any implementation exists or any result is known --
        see `research/GIT_WORKFLOW.md`, "Before writing code: the spec." If the
        work later turns exploratory, that gets recorded as a dated addendum on
        the branch, not by editing this issue to look like it predicted the
        detour.

  - type: dropdown
    id: type
    attributes:
      label: Branch type
      description: Determines the branch prefix per research/GIT_WORKFLOW.md.
      options:
        - "research/ -- substantial implementation or investigation"
        - "experiment/ -- one specific, scoped experiment"
        - "analysis/ -- analysis of an existing result, no new data collection"
        - "method/ -- a new methodological component"
        - "reproduction/ -- reproducing an external paper, benchmark, or system"
    validations:
      required: true

  - type: textarea
    id: research-question
    attributes:
      label: Research question
      description: What are we trying to determine? Specific enough to be answerable.
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What do we currently expect, and why?
    validations:
      required: true

  - type: textarea
    id: null-hypothesis
    attributes:
      label: Null / alternative hypothesis
      description: >-
        What result would contradict the hypothesis above? State it concretely
        enough that a result could actually fail to support it -- e.g. a NULL
        verdict within the pre-registered margin, not just "no visible difference."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: >-
        Why does this matter for the project's research thesis ("Does the
        Scaffold Earn Its Keep")? What would change if it were answered either way?
    validations:
      required: true

  - type: textarea
    id: experimental-design
    attributes:
      label: Experimental design
      description: >-
        How will this be tested? Domain/pipeline, scaffold vs. base searcher,
        budget, seed count, what varies and what's held constant.
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: Metrics
      description: >-
        What's measured, and which of those measurements decide the outcome.
        Note continuous (BCa bootstrap) vs. paired-binary (Tango score interval)
        -- see AUDIT_METHODOLOGY.md §4.2.
    validations:
      required: true

  - type: textarea
    id: baselines
    attributes:
      label: Baselines / controls
      description: >-
        What is this compared against? Default control is budget-matched
        independent restarts of the pipeline's own base searcher, not "no
        scaffold" -- note explicitly if this deviates and why.
    validations:
      required: true

  - type: textarea
    id: expected-outcomes
    attributes:
      label: Expected outcomes
      description: >-
        Enumerate the plausible outcomes, not just the hoped-for one -- e.g.
        CONTRIBUTES / NULL / HARMFUL / INCONCLUSIVE (underpowered) /
        INCONCLUSIVE (ceiling already below margin -- run the feasibility
        pre-check first).
    validations:
      required: true

  - type: textarea
    id: interpretation-plan
    attributes:
      label: Interpretation plan
      description: >-
        For each outcome above: what would it mean, and what would it NOT
        mean? What follow-up would each imply?
    validations:
      required: true

  - type: textarea
    id: confounds
    attributes:
      label: Confounds considered
      description: What could produce a false positive or false negative, and how (if at all) is it controlled for?
    validations:
      required: true
