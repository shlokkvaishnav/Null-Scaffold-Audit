[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-discovery-engine"
version = "0.1.0"
description = "Scientific Discovery Engine (SDE): a domain-agnostic engine (engine/) that orchestrates swappable algorithm/domain plugins behind stable interfaces, plus a CLI (cli/) and the first plugin, physics_discovery -- an agentic hypothesize-test-refine system for closed-form equation discovery via symbolic regression, benchmarked on the AI-Feynman physics equation set."
authors = [{ name = "Shlok Vaishnav" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "gplearn",
    "sympy",
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "typer",
    "pyyaml",
]

[project.scripts]
sde = "cli.main:app"

# Any installed package can add its own domain/algorithm plugins by declaring
# entry points in this same group in its own pyproject.toml -- see
# engine/discovery.py and docs/PLUGIN_GUIDE.md. This repo's own plugins are
# registered the same way, not special-cased anywhere in engine/ or cli/.
[project.entry-points."sde.plugins"]
feynman_physics = "physics_discovery.plugins.feynman:register"
synthetic_regression = "physics_discovery.plugins.synthetic:register"

[project.optional-dependencies]
pysr = ["pysr"]
torch = ["torch"]
gbm = ["xgboost", "lightgbm"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "black", "jupyterlab", "matplotlib", "httpx"]

[tool.setuptools.packages.find]
include = ["physics_discovery*", "engine*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# The legacy trees predate Milestone 0 and are awaiting migration behind the
# plugin contract. They are excluded rather than cleaned because a lint gate
# that reports hundreds of inherited findings is one that gets ignored, and an
# ignored gate protects nothing. Each tree returns to the gate as it is
# migrated -- the exclusion list is expected to shrink to nothing, and it is
# reviewed whenever it does not.
extend-exclude = [
    "physics_discovery",
    "alpha_discovery",
    "results",
]

[tool.ruff.lint]
# Ruff's defaults, plus import sorting and pyupgrade. Deliberately close to
# what this codebase already satisfied: the gate exists to stop new drift, and
# a rule set chosen to maximise findings on day one gets switched off by week
# two. Widening this set is an architecture decision and belongs in an ADR
# (BOOTSTRAP.md §10), not in a lint config edited in passing.
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
