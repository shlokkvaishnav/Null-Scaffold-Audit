[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climate_discovery"
version = "0.1.0"
description = "A research package for discovering climate equations using neuro-symbolic AI."
authors = [
  { name = "Shlok Vaishnav", email = "shlok9640@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "xarray>=0.20.0",
    "netCDF4>=1.5.0",
    "pysr>=0.18.0",
    "torch>=2.0.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.7.0",
    "pyyaml>=6.0",
    "dask>=2022.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "tqdm>=4.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["climate_discovery"]
skip_glob = ["*/migrations/*"]

[tool.black]
line-length = 88