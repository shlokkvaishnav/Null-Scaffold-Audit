[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climate_discovery"
version = "0.1.0"
description = "A research package for discovering climate equations using neuro-symbolic AI."
authors = [
  { name = "Shlok Vaishnav", email = "your.email@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "pysr",
    "torch",
    "scikit-learn",
    "hmmlearn",
    "pyyaml",
    "netCDF4",
    "dask",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["climate_discovery"]
skip_glob = ["*/migrations/*"]

[tool.black]
line-length = 88