[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-discovery-engine"
version = "0.1.0"
description = "Scientific Discovery Engine (SDE): a domain-agnostic engine (engine/) that orchestrates swappable algorithm/domain plugins behind stable interfaces, plus a CLI (cli/) and engine/audit -- a budget-matched, equivalence-tested audit of whether a search pipeline's scaffold contributes anything over its own base searcher. Current research direction, 'Does the Scaffold Earn Its Keep': auditing Neural Architecture Search controllers (via NASLib) against budget-matched random-search restarts (via NATS-Bench). The original plugin, physics_discovery -- an agentic symbolic-regression system benchmarked on AI-Feynman -- is archived under archive/physics_equation_discovery/; it motivated engine/audit/ and is kept for provenance, not active development."
authors = [{ name = "Shlok Vaishnav" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pydantic",
    "typer",
    "pyyaml",
]

[project.scripts]
sde = "cli.main:app"

# Any installed package can add its own domain/algorithm plugins by declaring
# entry points in this same group in its own pyproject.toml -- see
# engine/discovery.py and docs/PLUGIN_GUIDE.md. This repo's own plugins are
# registered the same way, not special-cased anywhere in engine/ or cli/.
#
# Empty for now: feynman_physics and synthetic_regression were removed here
# when their code moved to archive/physics_equation_discovery/ (their entry
# points pointed at a module path that no longer exists in the active tree).
# nas_search is the next entry to add, once plugins/nas_search/ exists.
[project.entry-points."sde.plugins"]

[project.optional-dependencies]
# naslib is NOT in this extra yet -- verified blocked, not just unlisted.
# It has no PyPI release (last push 2024-11-11, ~2 years stale as of this
# pivot) and installing it as a git dependency fails outright:
# `git submodule update --init` errors on a broken submodule reference
# (sphinx_source_code has no URL in .gitmodules), which `uv lock` triggers
# automatically. No open upstream issue found for this specific failure.
# Resolving this -- fork-and-fix, a manual non-recursive clone, or an
# alternative NAS-controller library -- is the first concrete task for
# plugins/nas_search/, not a restructuring-phase problem. See the migration
# report for this pivot.
#
# nats-bench has a normal PyPI release and resolves cleanly on its own.
nas = ["nats-bench"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "black", "jupyterlab", "matplotlib", "httpx"]

[tool.setuptools.packages.find]
include = ["engine*", "cli*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `uv run pytest` (no -m) does not add the repo root to
# sys.path, so `import scripts.research_queue` in tests/test_research_queue.py
# fails -- `uv run python -m pytest` masked this because `python -m` adds cwd
# to sys.path itself. Found during the "Does the Scaffold Earn Its Keep" pivot
# validation, invocation-sensitive rather than introduced by that pivot: it
# depends on how pytest is invoked, not on which plugin code exists.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# `results/` holds generated artifacts, not source, and is never linted.
#
# physics_discovery/ and alpha_discovery/ used to sit here as well, on the
# argument that a gate reporting hundreds of inherited findings gets ignored.
# That argument expires once the findings are fixed: the tree is now clean and
# stays in the gate, so the domain-independence refactor cannot move unlinted
# code into the core. The exclusion list has shrunk to nothing but generated
# output, which is where it was always supposed to end up.
#
# `docs/` is excluded from the formatter, not from review. The RFCs and
# engineering standards are authored specifications, and the Python samples
# inside them are illustrations chosen by their author -- reflowing those to
# satisfy a formatter would edit someone's argument to suit a tool. The code
# they describe is formatted; the description of it is not.
#
# research/*.md gets the same treatment for the same reason -- ruff format
# reformats Python code fences embedded in Markdown, and research/ carries
# governance docs (AUDIT_METHODOLOGY.md, etc.) with illustrative snippets,
# not this project's actual source. Excluded by pattern, not by directory:
# a future research/*.py analysis script should still be linted normally.
extend-exclude = [
    "results",
    "docs",
    "archive",
    "research/*.md",
    # Skill packages installed via skills.sh (npx skills add) -- documentation
    # with embedded code samples, not this project's source.
    ".agents",
]

[tool.ruff.lint]
# Ruff's defaults, plus import sorting and pyupgrade. Deliberately close to
# what this codebase already satisfied: the gate exists to stop new drift, and
# a rule set chosen to maximise findings on day one gets switched off by week
# two. Widening this set is an architecture decision and belongs in an ADR
# (an ADR under docs/adr/), not in a lint config edited in passing.
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
