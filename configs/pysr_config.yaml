binary_operators:
  - "+"
  - "*"
  - "-"
  # - "/"  <-- REMOVED for stability

unary_operators:
  - "exp"
  - "log"
  - "sin"  # Essential for the seasonal cycle
  - "cos"  # Essential for the seasonal cycle

# Evolution Strategy
populations: 20
population_size: 50
niterations: 200     # Good balance of speed/quality
parsimony: 0.001
random_state: 42

# Constraints
maxsize: 25
model_selection: "best"

complexity_of_operators:
  "exp": 2
  "log": 2
  "sin": 2
  "cos": 2