experiment_name: benchmark_minimal
dataset_split:
  strategy: canonical_time_split
  train: train
  validation: validation
  test: test
seed_policy:
  deterministic: true
  seeds: [7, 11, 23, 47, 101, 131, 181, 223, 269, 307]
models:
  - pysr_global
  - neural_moe
  - lightgbm
  - sdmose_full
ablations:
  - no_vsb
  - no_igbu
  - no_constraints_stability
metrics:
  - rmse
  - mae
  - calibration_error
  - symbolic_complexity
  - runtime_seconds
reporting:
  run_columns: [seed, model, split]
  aggregate:
    mean: float
    ci95: float
  artifact_format: json+csv
significance:
  confidence_level: 0.95
  test: paired_t_test
budget:
  max_iters: 25
  candidate_bank_size: 20
  regimes: 4
