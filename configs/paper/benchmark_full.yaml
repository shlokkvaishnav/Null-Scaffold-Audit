experiment_name: benchmark_full
seed_policy:
  deterministic: true
  seeds: [7, 11, 23, 47, 101, 131, 181, 223, 269, 307]
models:
  - pysr_global
  - neural_moe
  - xgboost
  - sdmose_full
ablations:
  - no_vsb
  - no_igbu
  - no_constraints_stability
metrics:
  - rmse
  - mae
  - calibration_error
  - symbolic_complexity
  - runtime_seconds
significance:
  confidence_level: 0.95
  test: paired_t_test
budget:
  max_iters: 25
  candidate_bank_size: 20
  regimes: 4

calibration:
  ece_bins: 12
  num_samples: 256
